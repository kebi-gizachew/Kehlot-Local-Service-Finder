<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Change Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body{font-family:'Inter',sans-serif;background:#F9FAFB;margin:0;color:#111827}
        header{background:white;padding:16px 32px;border-bottom:1px solid #EEF2F4;display:flex;align-items:center}
        .back{cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px;color:#4B5563;transition:color 0.2s}
        .back:hover{color:#111827}
        .container{max-width:480px;margin:60px auto;padding:0 20px}
        .card{background:white;border-radius:20px;padding:40px;border:1px solid #F3F4F6;box-shadow:0 10px 30px rgba(0,0,0,0.04)}
        .muted{color:#6B7280;font-size:14px;line-height:1.5}
        h2{font-size:24px;font-weight:700;margin-bottom:8px;color:#111827}
        label{display:block;font-size:14px;font-weight:500;color:#374151;margin-bottom:8px;margin-top:20px}
        .input{width:100%;padding:12px 16px;border-radius:12px;border:1px solid #E5E7EB;font-size:15px;outline:none;transition:border-color 0.2s, box-shadow 0.2s}
        .input:focus{border-color:#0FB7C2;box-shadow:0 0 0 3px rgba(15,183,194,0.1)}
        .btn{width:100%;padding:14px;border-radius:12px;border:none;background:#0FB7C2;color:white;font-weight:600;font-size:16px;cursor:pointer;margin-top:24px;transition:background 0.2s}
        .btn:hover{background:#0d9aa3}
        @media (max-width:520px){ .container{margin:30px auto} .card{padding:24px} }
    </style>
</head>
<body>
<header>
    <div style="display:flex;align-items:center;gap:12px"><div class="back" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i> Back to Profile</div></div>
    <div></div>
</header>

<main class="container">
    <div class="card">
        <h2>Change Password</h2>
        <p class="muted">Verify your current credentials to set a new password.</p>
        <div style="margin-top:24px">
            <label style="margin-top:0">Current Password</label>
            <input id="curr" type="password" class="input">
            <label>New Password</label>
            <input id="newpw" type="password" class="input">
            <label>Confirm New Password</label>
            <input id="conf" type="password" class="input">
            <button class="btn" onclick="updatePassword()">Update Password</button>
        </div>
    </div>
</main>

<!-- UI feedback banner -->
<div id="ui-feedback" style="position:fixed;right:20px;top:80px;display:none;padding:12px 18px;border-radius:10px;color:#fff;z-index:9999;box-shadow:0 6px 18px rgba(0,0,0,0.08)"></div>

<script>
    const API_BASE = 'http://localhost:5000';
    function goBack(){ const params=new URLSearchParams(window.location.search); const id=params.get('provider'); window.location.href = id ? `../providerProfile.html?provider=${encodeURIComponent(id)}` : '../providerProfile.html'; }

    function showUIFeedback(msg, type='info'){
        const el = document.getElementById('ui-feedback');
        el.textContent = msg;
        el.className = '';
        el.style.display = 'block';
        if(type === 'success'){
            el.style.background = 'linear-gradient(90deg,#16a34a,#059669)';
        } else if(type === 'error'){
            el.style.background = 'linear-gradient(90deg,#ef4444,#f97316)';
        } else {
            el.style.background = 'rgba(0,0,0,0.7)';
        }
        if(type === 'info') setTimeout(()=>{ el.style.display='none'; }, 3000);
    }

    async function updatePassword(){
        const curr = document.getElementById('curr').value;
        const n = document.getElementById('newpw').value;
        const conf = document.getElementById('conf').value;
        if(!curr || !n || n !== conf){
            return showUIFeedback('Please ensure fields are filled and new passwords match', 'error');
        }
        try{
            const token = localStorage.getItem('authToken')||localStorage.getItem('token');
            const headers = {'Content-Type':'application/json'}; if(token) headers['Authorization']=`Bearer ${token}`;
            // Backend expects { oldPassword, newPassword }
            const res = await fetch(`${API_BASE}/api/auth/change-password`,{
                method: 'POST', headers, credentials: 'include', body: JSON.stringify({ oldPassword: curr, newPassword: n })
            });
            const body = await res.json().catch(()=>({}));
            if(res.ok){
                showUIFeedback(body.message || 'Password updated', 'success');
                // After short delay redirect back to profile
                setTimeout(()=>{
                    const params = new URLSearchParams(window.location.search);
                    const pid = params.get('provider');
                    window.location.href = pid ? `../providerProfile.html?provider=${encodeURIComponent(pid)}` : '../providerProfile.html';
                },1200);
                return;
            }
            showUIFeedback(body.message || 'Failed to update password', 'error');
        }catch(e){console.error('change-password error', e); showUIFeedback('Error updating password', 'error')}
    }
</script>
</body>
</html>
