<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Provider Messages</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body{font-family:'Inter',sans-serif;background:#F9FAFB;color:#111827;margin:0}
        header{background:white;padding:14px 28px;border-bottom:1px solid #E6E9EE;display:flex;justify-content:space-between;align-items:center}
        .page{max-width:820px;margin:28px auto;padding:0 16px}
        .card{background:white;border-radius:14px;border:1px solid #EEF2F4;box-shadow:0 4px 20px rgba(0,0,0,0.04);overflow:hidden}
        .list-item{display:flex;align-items:center;gap:12px;padding:18px;border-bottom:1px solid #F3F4F6;cursor:pointer}
        .initial{width:48px;height:48px;border-radius:50%;background:#F3F9FA;color:#0FB7C2;display:flex;align-items:center;justify-content:center;font-weight:700}
        .meta{flex:1;display:flex;justify-content:space-between;align-items:center}
        .muted{color:#6B7280;font-size:13px}
        .back-btn{cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;color:#374151;transition:background-color 0.2s,color 0.2s}
        .back-btn:hover{background-color:#F3F4F6;color:#111827}
    </style>
</head>
<body>
<header>
    <div class="back-btn" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</div>
    <div id="nav-name" class="muted">Loading...</div>
</header>

<main class="page">
    <div class="card" id="conversations-card"></div>
</main>

<script>
    const API_BASE = 'http://localhost:5000';
    // Socket.IO client connect with auth token from localStorage
    (function(){
        const s = document.createElement('script');
        s.src = 'https://cdn.socket.io/4.6.1/socket.io.min.js';
        s.onload = () => {
            try {
                window.__socket = (typeof io === 'function') ? io(API_BASE, { auth: { token: localStorage.getItem('authToken')||'' }, withCredentials: true }) : null;
                if (window.__socket) {
                    window.__socket.on('connect', () => {
                        console.log('socket connected', window.__socket.id);
                        // join provider room if currentUser is provider
                        try {
                            const cur = JSON.parse(localStorage.getItem('currentUser')||'null')||{};
                            const pid = cur.id || cur.userId || cur._id || (new URLSearchParams(window.location.search)).get('provider');
                            if (pid) window.__socket.emit('join', String(pid));
                        } catch(e){}
                    });
                    window.__socket.on('conversations:update', (payload) => {
                        // refresh conversation list when updates arrive
                        console.log('conversations:update', payload);
                        init();
                    });
                }
            } catch(e){ console.warn('socket init failed', e); }
        };
        document.head.appendChild(s);
    })();
    document.addEventListener('DOMContentLoaded', init);

    function goBack(){ 
        const params = new URLSearchParams(window.location.search);
        const pid = params.get('provider');
        window.location.href = pid ? `../providerProfile.html?provider=${encodeURIComponent(pid)}` : '../providerProfile.html'; 
    }

    async function init(){
        const params = new URLSearchParams(window.location.search);
        const providerId = params.get('provider') || (JSON.parse(localStorage.getItem('currentUser')||'null')||{}).id;
        const provName = (JSON.parse(localStorage.getItem('currentUser')||'null')||{}).name || 'Provider';
        document.getElementById('nav-name').textContent = provName;
        if(!providerId) return renderSample();
        try{
            // Fetch conversations for provider
            const token = localStorage.getItem('authToken') || localStorage.getItem('token');
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = `Bearer ${token}`;
            const res = await fetch(`${API_BASE}/api/messages/conversations`, { credentials: 'include', headers });
            let payload = await res.json().catch(()=>({}));
            let list = [];
            if(res.ok && payload && Array.isArray(payload.data)) list = payload.data;
            if(list.length===0) return renderSample();
            renderList(list, providerId);
        }catch(e){console.warn(e); renderSample();}
    }

    function renderSample(){
        // No conversations — show empty state
        const wrap = document.getElementById('conversations-card'); wrap.innerHTML = '';
        const empty = document.createElement('div');
        empty.style.padding = '40px';
        empty.style.textAlign = 'center';
        empty.style.color = '#6B7280';
        empty.innerHTML = '<div style="font-weight:700;margin-bottom:8px">No messages</div><div>There are no conversations yet.</div>';
        wrap.appendChild(empty);
    }

    function renderList(items, providerId){
        const wrap = document.getElementById('conversations-card'); wrap.innerHTML='';
        items.forEach(it=>{
            // API shape: { userId, name, role, lastMessage }
            const uid = it.userId || it.id || (it.user && it.user.id) || null;
            let name = it.name || it.fullName || (it.user && it.user.fullName) || null;
            const last = it.lastMessage || it.last || it.last_message || '';

            const row = document.createElement('div'); row.className='list-item';
            const initial = document.createElement('div'); initial.className='initial'; initial.textContent = ((name||'U').trim().slice(0,1)).toUpperCase();
            const meta = document.createElement('div'); meta.className='meta';
            const left = document.createElement('div'); left.innerHTML = `<div style="font-weight:700">${escapeHtml(name)}</div><div class="muted">${escapeHtml(last)}</div>`;
            const right = document.createElement('div'); right.innerHTML = '<i class="fa-solid fa-chevron-right"></i>';
            meta.appendChild(left); meta.appendChild(right);
            row.appendChild(initial); row.appendChild(meta);
            row.onclick = ()=> openChat({ id: uid, name }, providerId);
            wrap.appendChild(row);

            // If name is missing, fetch user details to fill it in
            if ((!name || name === 'null') && uid) {
                (async () => {
                    try {
                        const token = localStorage.getItem('authToken') || localStorage.getItem('token');
                        const headers = { 'Content-Type': 'application/json' };
                        if (token) headers['Authorization'] = `Bearer ${token}`;
                        const r = await fetch(`${API_BASE}/api/users/${encodeURIComponent(uid)}`, { headers, credentials: 'include' });
                        const p = await r.json().catch(()=>({}));
                        const fullname = (p && (p.fullName || p.name)) || null;
                        if (fullname) {
                            name = fullname;
                            initial.textContent = name.trim().slice(0,1).toUpperCase();
                            left.innerHTML = `<div style="font-weight:700">${escapeHtml(name)}</div><div class="muted">${escapeHtml(last)}</div>`;
                        }
                    } catch (e) { /* ignore */ }
                })();
            }
        });
    }

    function escapeHtml(s){ if(!s) return ''; return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]; }); }

    function openChat(user, providerId){
        // Navigate to provider-specific chat page with provider and user ids
        try{
            const me = JSON.parse(localStorage.getItem('currentUser')||'null') || {};
            if(me && me.id && String(me.id) !== String(providerId)) {
                // if currentUser is not the provider, store provider as currentUser for provider-side chat
                // but preserve original currentUser under backup key
                localStorage.setItem('provider_backup_user', JSON.stringify(me));
                localStorage.setItem('currentUser', JSON.stringify({ id: providerId, role: 'provider', name: me.name || 'Provider', profileImage: me.profileImage || '' }));
            }
        }catch(e){/* ignore */}
        // Redirect to provider-specific chat page (provider view)
        window.location.href = `chat.html?ref=${encodeURIComponent(providerId)}&user=${encodeURIComponent(user.id)}`;
    }
</script>
</body>
</html>
