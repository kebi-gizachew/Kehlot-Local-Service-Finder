<script>
/* --- APP STATE --- */
/* --- APP STATE --- */
const AppState = {
    currentUser: { id: 1, name: "user", role: "customer" },
    selectedCategory: { name: "", icon: "" },
    currentProvider: null,
    chatHistory: [], // Structure: {providerId, messages[]} 
    userRating: 0,
    isProcessing: false // ADDED: Global lock for async operations
};

let providerDatabase = [

]; // Default provider store (will be replaced by server data when available)

/* --- API SERVICE CONTRACTS (MOCK) --- */
const API = {
    async fetchProviders(filters) {
        await new Promise(r => setTimeout(r, 400));
        let data = providerDatabase;
        if (filters.skill) data = data.filter(p => p.skill === filters.skill);
        if (filters.search) {
            const s = filters.search.toLowerCase();
            // Search by location only
            data = data.filter(p => p.loc.toLowerCase().includes(s));
        }
        return { success: true, data };
    },

    async submitReview(payload) {
        // FIXED: Explicit payload validation
        if (!payload.providerId || !payload.stars || payload.stars < 1) {
            throw new Error("Invalid review data: Stars required.");
        }
        await new Promise(r => setTimeout(r, 600));
        return { 
            success: true, 
            message: "Review submitted successfully.",
            newAverage: Math.min(5, payload.stars),
            newTotal: 1
        };
    },

    async postMessage(payload) {
        // FIXED: Context and Content validation
        if (!payload.providerId || !payload.content) {
            throw new Error("Message failed: Recipient or content missing.");
        }
        await new Promise(r => setTimeout(r, 300));
        
        // Save message to localStorage
        const messageData = { 
            ...payload, 
            id: Date.now(), 
            timestamp: new Date().toISOString(),
            senderId: AppState.currentUser.id,
            type: 'text'
        };
        
        const chatHistory = JSON.parse(localStorage.getItem('chatHistory')) || [];
        chatHistory.push(messageData);
        localStorage.setItem('chatHistory', JSON.stringify(chatHistory));
        
        return { 
            success: true, 
            data: messageData 
        };
    },

    async deleteMessage(id) {
        await new Promise(r => setTimeout(r, 200));
        return { success: true };
    }
};



/* --- CORE FUNCTIONS --- */
function notify(msg, type='success') {
    const b = document.getElementById('feedbackBanner');
    b.innerText = msg;
    b.className = `ui-feedback-banner bg-${type}`;
    b.style.display = 'block';
    setTimeout(() => b.style.display = 'none', 3000);
}

function showConfirmation(message) {
    const box = document.getElementById('confirmationMsg');
    if(!box) return;
    box.textContent = message;
    box.style.display = 'block';
    setTimeout(() => { box.style.display = 'none'; }, 3000);
}

function showView(id) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    const target = document.getElementById(`view-${id}`);
    if(target) target.classList.add('active');
    if (id === 'listing') initializeCategoryView();
}

/* --- URL PARAMETER HANDLING --- */
const API_BASE = "http://localhost:5000";

// Normalize category names to the server-expected values and provide a user-friendly display name
function normalizeCategories(arr) {
    if (!Array.isArray(arr)) return [];
    const map = {
        'electrical': 'Electrician',
        'electrician': 'Electrician',
        'plumbing': 'Plumber',
        'plumber': 'Plumber',
        'cleaning': 'Cleaner',
        'cleaner': 'Cleaner',
        'mechanics': 'Mechanic',
        'mechanic': 'Mechanic',
        'painting': 'Painting',
        'painter': 'Painting',
        'painting_contractor': 'Painting',
        'painting-contractor': 'Painting',
        'carpentry': 'Carpenter',
        'carpenter': 'Carpenter'
    };
    return arr.map(s => (s || '').toString().trim()).filter(Boolean).map(s => {
        const key = s.toLowerCase();
        return map[key] || (s.charAt(0).toUpperCase() + s.slice(1).toLowerCase());
    });
}

// Map a UI category string to the server-side canonical token (e.g., 'Painting' -> 'PAINTING_CONTRACTOR')
function getServiceToken(input) {
    if (!input) return null;
    const s = input.toString().toLowerCase().trim();
    // normalize hyphens/underscores/spaces
    const key = s.replace(/[-\s]+/g, '_');
    if (key.includes('electri') || key === 'electrician' || key === 'electrical') return 'ELECTRICIAN';
    if (key.includes('plumb') || key === 'plumber' || key === 'plumbing') return 'PLUMBER';
    if (key.includes('clean')) return 'CLEANER';
    if (key.includes('paint') || key.includes('painter') || key === 'painting_contractor' || key === 'painting-contractor') return 'PAINTING_CONTRACTOR';
    if (key.includes('carpent') || key === 'carpenter') return 'CARPENTER';
    if (key.includes('mechanic') || key === 'mechanics') return 'MECHANIC';
    // Fallback: return the uppercase underscore version of the input
    return key.toUpperCase();
}

function displaySkillName(skill) {
    if (!skill) return '';
    // Make human-friendly label (Title Case)
    const s = skill.toString().replace(/_/g, ' ').toLowerCase();
    return s.charAt(0).toUpperCase() + s.slice(1);
}

const params = new URLSearchParams(window.location.search);
const category = params.get('cat');
let filters = params.get('filters') ? params.get('filters').split(',') : [];
console.log('filters from URL:', filters)

// Load providers from backend (or fall back to local mock)
async function loadProvidersFromServer(filtersArr = []) {
    try {
        // If filters provided, prefer the filter endpoint
        if (Array.isArray(filtersArr) && filtersArr.length > 0) {
            // Convert UI filter strings into server-side tokens (e.g., 'Painting' -> 'PAINTING_CONTRACTOR')
            const categories = Array.from(new Set(filtersArr.map(f => getServiceToken(f)).filter(Boolean)));
            const res = await fetch(`${API_BASE}/api/provider/filter`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ categories })
            });
            if (!res.ok) throw new Error(`Filter request failed (${res.status})`);
            const body = await res.json();
            // Expecting an array of providers in body.data or body.providers or body
            const list = body.data || body.providers || body || [];
            return Array.isArray(list) ? list : [];
        }

        // No filters: fetch all providers (GET)
        const res = await fetch(`${API_BASE}/api/provider/`, { method: 'GET' });
        if (!res.ok) throw new Error(`List request failed (${res.status})`);
        const body = await res.json();
        const list = body.data || body.providers || body || [];
        return Array.isArray(list) ? list : [];
    } catch (err) {
        console.warn('loadProvidersFromServer failed, falling back to local data:', err.message || err);
        return null; // caller will use mock providerDatabase
    }
}

function getIconForSkill(skill) {
    const map = {
        'Plumber': '🔧',
        'Electrician': '⚡',
        'Cleaner': '🧹',
        'Carpenter': '🔲',
        'Painting': '🎨',
        'Mechanic': '⚙️'
    };
    return map[skill] || '📋';
}

// Extract rating/count information from various possible server response shapes.
function extractRatingInfo(p) {
    // Possible shapes handled:
    // - p.averageRating, p.avgRating, p.average_rating
    // - p._avg?.rating (Prisma)
    // - p.ratings (array) or p.ratingsCount / p.ratingCount
    // - p._count?.ratings
    const info = {};

    // Count/total reviews
    info.reviews = null;
    if (typeof p.ratingCount !== 'undefined' && p.ratingCount !== null) info.reviews = Number(p.ratingCount);
    else if (typeof p.ratingsCount !== 'undefined' && p.ratingsCount !== null) info.reviews = Number(p.ratingsCount);
    else if (typeof p.rating_count !== 'undefined' && p.rating_count !== null) info.reviews = Number(p.rating_count);
    else if (typeof p.ratings_count !== 'undefined' && p.ratings_count !== null) info.reviews = Number(p.ratings_count);
    else if (p._count && typeof p._count.ratings !== 'undefined') info.reviews = Number(p._count.ratings);
    else if (Array.isArray(p.ratings)) info.reviews = p.ratings.length;
    else if (typeof p.reviews !== 'undefined' && p.reviews !== null) info.reviews = Number(p.reviews);

    // Average rating
    let avg = null;
    if (typeof p.averageRating !== 'undefined' && p.averageRating !== null) avg = Number(p.averageRating);
    else if (typeof p.avgRating !== 'undefined' && p.avgRating !== null) avg = Number(p.avgRating);
    else if (typeof p.average_rating !== 'undefined' && p.average_rating !== null) avg = Number(p.average_rating);
    else if (p._avg && typeof p._avg.rating !== 'undefined' && p._avg.rating !== null) avg = Number(p._avg.rating);
    else if (p.ratings && typeof p.ratings === 'object' && typeof p.ratings.average !== 'undefined') avg = Number(p.ratings.average);
    else if (typeof p.avg !== 'undefined' && p.avg !== null) avg = Number(p.avg);

    // If ratings array with numeric entries, compute average
    if (avg === null && Array.isArray(p.ratings) && p.ratings.length > 0) {
        const nums = p.ratings.map(r => typeof r.rating !== 'undefined' ? Number(r.rating) : Number(r)).filter(n => !isNaN(n));
        if (nums.length > 0) {
            avg = nums.reduce((a,b)=>a+b,0)/nums.length;
        }
    }

    info.average = (avg === null || isNaN(avg)) ? null : avg;
    const rounded = info.average !== null ? Math.max(0, Math.min(5, Math.round(info.average))) : (typeof p.stars !== 'undefined' ? Number(p.stars) : (typeof p.rating !== 'undefined' ? Number(p.rating) : 0));
    info.stars = rounded;
    if (info.reviews === null) info.reviews = 0;
    return info;
}

async function initializeCategoryView() {
    const container = document.getElementById('view-listing');
    if (!container) return;

    // Attempt to load providers from server first. If a single category is present, use it as a filter.
    const effectiveFilters = (Array.isArray(filters) && filters.length > 0) ? filters : (category ? [category] : []);
    const serverData = await loadProvidersFromServer(effectiveFilters);
    if (Array.isArray(serverData)) {
        // Normalize basic fields to match expected UI shape (server is authoritative even if empty)
        providerDatabase = serverData.map(p => ({
            // serviceId is the authoritative ID for ServiceProvider.id (prefer these fields)
            serviceId: p.serviceProviderId || p.id || p._id || p.providerId || null,
            // userId, if present, of the user record associated with the provider
            userId: (p.user && p.user.id) || p.userId || null,
            // display id (unique for UI lists) - prefer serviceId, fall back to other ids
            id: p.serviceProviderId || p.id || p._id || p.providerId || Date.now(),
            name: p.fullName || p.name || p.user?.fullName || '',
            // Normalize the skill/category to canonical names (Painting, Plumber, etc.)
            skill: (normalizeCategories([p.serviceType || p.skill || p.service || ''])[0]) || '',
            loc: p.location || p.loc || p.address || '',
            phone: p.phone || p.contact || '',
            email: p.email || p.user?.email || '',
            img: p.profileImage || p.img || p.image || 'pic/default-avatar.jpg',
            bio: p.bio || p.description || '',
            reviews: p.ratingCount || p.ratingsCount || p.rating_count || p.ratings_count || p.reviews || (Array.isArray(p.ratings) ? p.ratings.length : 0),
            averageRating: (typeof p.averageRating !== 'undefined' && p.averageRating !== null) ? Number(p.averageRating) : (typeof p.avgRating !== 'undefined' && p.avgRating !== null) ? Number(p.avgRating) : (typeof p.average_rating !== 'undefined' && p.average_rating !== null) ? Number(p.average_rating) : null,
            stars: (typeof p.averageRating !== 'undefined' && p.averageRating !== null) ? Math.round(Number(p.averageRating)) : (typeof p.avgRating !== 'undefined' && p.avgRating !== null) ? Math.round(Number(p.avgRating)) : (typeof p.average_rating !== 'undefined' && p.average_rating !== null) ? Math.round(Number(p.average_rating)) : (p.stars || p.rating || 0)

        // Cache the normalized list so other pages (provider detail) can use it as a reliable fallback
        try { sessionStorage.setItem('providersCache', JSON.stringify(providerDatabase)); } catch (e) { console.warn('Failed to cache providers', e); }

        filters = Array.from(new Set(providerDatabase.map(p => p.skill).filter(Boolean))).map(f => normalizeCategories([f])[0]);

/* --- PROVIDER RENDERING FUNCTIONS --- */
function renderProvidersBySkill(skill, workers) {
    const safeSkillKey = (skill || '').toString().toLowerCase().replace(/\s+/g, '-');
    // Try the specific section id first (handles single category and multi-section views), fallback to generic 'provider-list'
    const specificId = `provider-list-${safeSkillKey}`;
    let container = document.getElementById(specificId);
    if (!container) container = document.getElementById('provider-list');
    if (!container) return;
    
    container.innerHTML = '';
    
    if (workers.length === 0) {
        container.innerHTML = `
            <p style="grid-column:1/-1; text-align:center; color:#64748b; padding:20px;">
                No ${displaySkillName(skill)} workers found.
            </p>
        `;
        return;
    }
    
    workers.forEach(p => {
        const providerCard = createProviderCard(p);
        container.appendChild(providerCard);
    });
}

function renderAllProviders() {
    const container = document.getElementById('provider-list');
    if (!container) return;
    
    container.innerHTML = '';
    
    if (providerDatabase.length === 0) {
        container.innerHTML = `
            <p style="grid-column:1/-1; text-align:center; color:#64748b; padding:20px;">
                No workers found.
            </p>
        `;
        return;
    }
    
    providerDatabase.forEach(p => {
        const providerCard = createProviderCard(p);
        container.appendChild(providerCard);
    });
}

function createProviderCard(p) {
    const avg = (typeof p.averageRating !== 'undefined' && p.averageRating !== null) ? Number(p.averageRating) : Number(p.stars || 0);
    const rounded = Math.max(0, Math.min(5, Math.round(avg)));
    const goldStars = "★".repeat(rounded);
    const grayStars = "★".repeat(5 - rounded);
    const imgSrc = (p.img && (p.img.startsWith('http') || p.img.includes('/'))) ? p.img : 'pic/' + p.img;
    
    const providerCard = document.createElement('div');
    providerCard.className = 'option-card';
    // Expose both provider id and authoritative service id (serviceId preferred)
    providerCard.dataset.providerId = p.serviceId || p.id;
    if (p.serviceId) providerCard.dataset.serviceId = p.serviceId;
    providerCard.setAttribute('tabindex', '0');
    
    providerCard.innerHTML = `
        <img src="${imgSrc}" 
             style="width:50px; height:50px; border-radius:10px; margin-right:15px; object-fit:cover;"
             onerror="this.src='pic/default-avatar.jpg'">
        <div class="option-info">
            <p class="text-bold" style="margin:0">${p.name}</p>
            <p class="text-muted loc-data" style="margin:3px 0 0 0; display:flex; align-items:center; gap:6px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0F98B3" stroke-width="2">
                    <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
                    <circle cx="12" cy="10" r="3"/>
                </svg>
                ${p.loc}
            </p>
            <p class="text-muted" style="margin:3px 0 0 0; font-size:0.8rem; color:#0F98B3;">
                ${p.skill}
            </p>
        </div>
        <div style="margin-left:auto; text-align: right;">
            <div style="font-size: 0.9rem;">
                <span style="color:#f6ad55;">${goldStars}</span>
                <span style="color:#e2e8f0;">${grayStars}</span>
            </div>
            <span style="font-size: 0.8rem; color: #64748b;">(${p.reviews} reviews)</span>
        </div>
    `;
    
    providerCard.onclick = () => {
        // Navigate to provider profile page using authoritative service id if available
        const serviceId = p.serviceId || p.id;
        window.location.href = `../providerdetail.html?provider=${encodeURIComponent(serviceId)}`;
    };
    
    return providerCard;
}

function populateDetails(p) {
    document.getElementById('p-img').src = p.img;
    document.getElementById('p-name').textContent = p.name;
    document.getElementById('star-row-detail').textContent = "★".repeat(Math.round(p.stars)) + "☆".repeat(5 - Math.round(p.stars));
    document.getElementById('p-reviews').textContent = `${p.reviews} reviews`;
    document.getElementById('p-loc').textContent = p.loc;
    document.getElementById('p-phone').textContent = p.phone;
    document.getElementById('p-email').textContent = p.email;
    document.getElementById('p-bio').textContent = p.bio;
    
    // Check if there are messages with this provider
    const chatHistory = JSON.parse(localStorage.getItem('chatHistory')) || [];
    const hasMessages = chatHistory.some(m => m.providerId == p.id);
    
    const btnText = document.getElementById('message-btn-text');
    btnText.textContent = hasMessages ? 'View Messages' : 'Send Message';
}

/* --- FILTERING FUNCTIONS --- */
function filterProviders(skill) {
    const key = (skill || '').toString().toLowerCase().replace(/\s+/g, '-');
    const searchField = document.getElementById(`searchField-${key}`);
    const container = document.getElementById(`provider-list-${key}`);
    
    if (!searchField || !container) return;
    
    const searchTerm = searchField.value.toLowerCase();
    
    // Get all workers for this skill (case-insensitive)
    let workers = providerDatabase.filter(p => (p.skill || '').toLowerCase() === (skill || '').toLowerCase());
    
    // Filter by location if search term exists
    if (searchTerm) {
        workers = workers.filter(p => p.loc.toLowerCase().includes(searchTerm));
    }
    
    // Clear and re-render
    container.innerHTML = '';
    
    if (workers.length === 0) {
        container.innerHTML = `
            <p style="grid-column:1/-1; text-align:center; color:#64748b; padding:20px;">
                No ${displaySkillName(skill)} workers found in "${searchTerm}"
            </p>
        `;
        return;
    }
    
    workers.forEach(p => {
        const providerCard = createProviderCard(p);
        container.appendChild(providerCard);
    });
}

function filterAllProviders() {
    const searchField = document.getElementById('searchField');
    // Try generic list first, then try category-specific list based on selected category
    let container = document.getElementById('provider-list');
    if (!container && AppState.selectedCategory && AppState.selectedCategory.name) {
        const safe = AppState.selectedCategory.name.toString().toLowerCase().replace(/\s+/g, '-');
        container = document.getElementById(`provider-list-${safe}`);
    }
    
    if (!searchField || !container) return;
    
    const searchTerm = searchField.value.toLowerCase();
    let workers = providerDatabase;
    
    if (searchTerm) {
        workers = workers.filter(p => p.loc.toLowerCase().includes(searchTerm));
    }
    
    container.innerHTML = '';
    
    if (workers.length === 0) {
        container.innerHTML = `
            <p style="grid-column:1/-1; text-align:center; color:#64748b; padding:20px;">
                No workers found in "${searchTerm}"
            </p>
        `;
        return;
    }
    
    workers.forEach(p => {
        const providerCard = createProviderCard(p);
        container.appendChild(providerCard);
    });
}

function toggleModal(show) { 
    if(show && !AppState.currentProvider) {
        return notify("No provider selected to rate.", "error");
    }
    if(show) setRating(0); 
    document.getElementById('rateModal').style.display = show ? 'flex' : 'none'; 
}

function setRating(s){ 
    AppState.userRating = s; 
    Array.from(document.getElementById('rating-stars').children).forEach((el,i)=> { 
        el.innerText = i < s ? '★' : '☆'; 
        el.style.color = i < s ? '#f6ad55' : '#cbd5e1'; 
    }); 
}

async function submitRating(){
    if(AppState.isProcessing) return;
    if(!AppState.currentProvider) return notify("Provider session lost. Reloading...", "error");
    if(AppState.userRating === 0) return notify("Please select a star rating.", "error");
    
    AppState.isProcessing = true;
    const btn = document.getElementById('submitRatingBtn');
    btn.innerText = "Submitting...";

    try {
        // Build provider id: prefer numeric serviceId when available
        const rawId = AppState.currentProvider.serviceId || AppState.currentProvider.id;
        let pid = Number(rawId);
        if (!Number.isFinite(pid)) {
            const m = String(rawId).match(/(\d+)/);
            if (m) pid = Number(m[0]);
        }
        const payload = { providerId: Number.isFinite(pid) ? pid : rawId, rating: AppState.userRating };
        console.log('submitRating (providers list) payload:', payload);

        window.lastRatingDebug = { payload };
        const response = await fetch(`${API_BASE}/ratings`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(payload)
        });
        window.lastRatingDebug.responseStatus = response.status;

        if (!response.ok) {
            const errBody = await response.json().catch(() => ({}));
            window.lastRatingDebug.body = errBody;
            const msg = errBody.message || `Server responded ${response.status}`;
            throw new Error(msg);
        }

        const body = await response.json().catch(() => ({}));
        window.lastRatingDebug.body = body;
        const created = body.data || body || null;

        // Use server response if available
        if (typeof body.ratingsCount !== 'undefined') {
            AppState.currentProvider.reviews = Number(body.ratingsCount);
        } else {
            // Fallback to incrementing
            AppState.currentProvider.reviews = Number(AppState.currentProvider.reviews || 0) + 1;
        }

        if (typeof body.averageRating !== 'undefined' && body.averageRating !== null) {
            AppState.currentProvider.averageRating = Number(body.averageRating);
            AppState.currentProvider.stars = Math.round(AppState.currentProvider.averageRating);
        }

        // Update cached providers list
        try {
            const cached = JSON.parse(sessionStorage.getItem('providersCache') || 'null');
            if (Array.isArray(cached)) {
                const found = cached.find(p => String(p.serviceId) === String(AppState.currentProvider.serviceId) || String(p.id) === String(AppState.currentProvider.id));
                if (found) {
                    found.reviews = AppState.currentProvider.reviews;
                    if (AppState.currentProvider.averageRating != null) {
                        found.averageRating = AppState.currentProvider.averageRating;
                        found.stars = Math.round(AppState.currentProvider.averageRating);
                    } else {
                        found.stars = AppState.currentProvider.stars;
                    }
                    sessionStorage.setItem('providersCache', JSON.stringify(cached));
                }
            }
        } catch (e) { console.warn('Failed to update providersCache after rating', e); }

        // Re-render lists/section
        if (AppState.selectedCategory && AppState.selectedCategory.name && document.getElementById(`provider-list-${(AppState.selectedCategory.name||'').toLowerCase().replace(/\s+/g,'-')}`)) {
            filterProviders(AppState.selectedCategory.name);
        } else {
            renderAllProviders();
        }
        AppState.currentProvider.stars = roundedAvg;

        // Show success feedback
        notify('Thanks for the feedback!', 'success');

        const idx = providerDatabase.findIndex(p => p.id === AppState.currentProvider.id);
        if (idx !== -1) {
            providerDatabase[idx].reviews = AppState.currentProvider.reviews;
            if (typeof AppState.currentProvider.averageRating !== 'undefined' && AppState.currentProvider.averageRating !== null) {
                providerDatabase[idx].averageRating = AppState.currentProvider.averageRating;
                providerDatabase[idx].stars = Math.round(AppState.currentProvider.averageRating);
            } else {
                providerDatabase[idx].stars = roundedAvg;
            }
        }

        populateDetails(AppState.currentProvider);
        showConfirmation("Successfully submitted. Thank you for rating.");
        initializeCategoryView(); // Refresh the list
        toggleModal(false);
    } catch (e) {
        notify(e.message || "Submission failed.", "error");
    } finally {
        AppState.isProcessing = false;
        btn.innerText = "Submit Review";
    }
}

    }
}

    window.location.href = '../usermessage.html';
}

function showProviderMessages() {
    if(!AppState.currentProvider) return notify("Please select a provider first.", "error");
    
    // Populate recent messages for this provider
    populateRecentMessagesForProvider(AppState.currentProvider.id);
    
    // Show the recent messages view
    showView('recent-messages');
}

function populateAllRecentMessages() {
    const container = document.getElementById('recent-list');
    if (!container) return;
    
    // Clear existing content
    container.innerHTML = '';
    
    // Get all messages from localStorage
    const chatHistory = JSON.parse(localStorage.getItem('chatHistory')) || [];
    
    if (chatHistory.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:var(--text-gray); padding:20px;">No messages yet.</p>';
        return;
    }
    
    // Group messages by providerId
    const messagesByProvider = {};
    chatHistory.forEach(msg => {
        if (!messagesByProvider[msg.providerId]) {
            messagesByProvider[msg.providerId] = [];
        }
        messagesByProvider[msg.providerId].push(msg);
    });
    
    // For each provider, show the most recent message
    Object.keys(messagesByProvider).forEach(providerId => {
        const providerMessages = messagesByProvider[providerId];
        const provider = providerDatabase.find(p => p.id == providerId);
        if (!provider) return;
        
        // Sort by timestamp, get latest
        providerMessages.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        const latestMsg = providerMessages[0];
        
        const msgCard = document.createElement('div');
        msgCard.className = 'option-card';
        msgCard.style.cursor = 'pointer';
        msgCard.onclick = () => {
            // Set current provider and open chat
            AppState.currentProvider = provider;
            openChat();
        };
        
        const isNew = new Date(latestMsg.timestamp) > new Date(Date.now() - 24 * 60 * 60 * 1000); // Last 24 hours
        // Always display generic label under sender name
        const previewText = 'New message';
        
        msgCard.innerHTML = `
            <div style="display:flex; align-items:center; gap:10px;">
                <img src="${provider.img}" style="width:40px; height:40px; border-radius:50%; object-fit:cover;" onerror="this.src='../pic/default-avatar.png'">
                <div style="flex:1;">
                    <div style="font-weight:600; color:var(--text-dark); display:flex; justify-content:space-between; align-items:center;">
                        <span>${provider.name}</span>
                        ${isNew ? '<span style="background:var(--kihlot-teal); color:white; font-size:0.7rem; font-weight:600; padding:2px 6px; border-radius:10px;">New</span>' : ''}
                    </div>
                    <div style="color:var(--text-gray); font-size:0.95rem;">${previewText}</div>
                </div>
            </div>
        `;
        
        container.appendChild(msgCard);
    });
}

        const el = document.activeElement;
        if (el && el.classList && el.classList.contains('.option-card')) {
            const pid = el.dataset && el.dataset.providerId;
            if (pid) {
                openProviderDetailsById(pid);
                e.preventDefault();
            }
        }
    }
});

function openImgPopup(src) { 
    document.getElementById('popupTarget').src = src; 
    document.getElementById('imgPopup').style.display = 'flex';
}

function toggleLogout(show) { 
    document.getElementById('logoutModal').style.display = show ? 'flex' : 'none'; 
}

function logout() { 
    // Call server logout endpoint to clear cookie-based sessions (role-aware)
    (async () => {
        try {
            await fetch(`${API_BASE}/api/auth/logout`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ role: 'seeker' })
            });
        } catch (e) {
            console.warn('Logout request failed:', e);
        } finally {
            // Local cleanup and redirect regardless of server response
            try { localStorage.removeItem('seekerLoggedIn'); } catch (e) {}
            toggleLogout(false);
            window.location.href='../homepage.html';
        }
    })();
}

/* --- INITIALIZATION --- */
window.onload = () => {
    const urlParams = new URLSearchParams(window.location.search);
    const open = urlParams.get('open');
    const providerId = urlParams.get('provider');
    
    if (open === 'recent') { 
        populateAllRecentMessages();
        showView('recent-messages'); 
        return; 
    }
    
    if (open === 'chat' && providerId) {
        const provider = providerDatabase.find(p => p.id == providerId);
        if (provider) {
            AppState.currentProvider = provider;
            openChat();
            return;
        }
    }
    
    document.getElementById('header-username').innerText = AppState.currentUser.name;
    
    // Initialize view based on URL parameters
    initializeCategoryView();
    showView('listing');
};
</script>
