<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Messages</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <style>
        body{font-family:'Inter',sans-serif;background:#F9FAFB;color:#111827;margin:0}
        header{background:white;padding:14px 28px;border-bottom:1px solid #E6E9EE;display:flex;justify-content:space-between;align-items:center}
        .page{max-width:820px;margin:28px auto;padding:0 16px}
        .card{background:white;border-radius:14px;border:1px solid #EEF2F4;box-shadow:0 4px 20px rgba(0,0,0,0.04);overflow:hidden}
        .list-item{display:flex;align-items:center;gap:12px;padding:18px;border-bottom:1px solid #F3F4F6;cursor:pointer}
        .initial{width:48px;height:48px;border-radius:50%;background:#F3F9FA;color:#0FB7C2;display:flex;align-items:center;justify-content:center;font-weight:700}
        .meta{flex:1;display:flex;justify-content:space-between;align-items:center}
        .muted{color:#6B7280;font-size:13px}
        .back-btn{cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;color:#374151;transition:background-color 0.2s,color 0.2s}
        .back-btn:hover{background-color:#F3F4F6;color:#111827}
    </style>
</head>
<body>
<header>
    <div class="back-btn" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i> Back</div>
    <div id="nav-name" class="muted">Messages</div>
</header>

<main class="page">
    <div class="card" id="conversations-card"></div>
</main>

<script>
    const API_BASE = 'http://localhost:5000';
    const socket = (typeof io === 'function') ? io(API_BASE, { auth: { token: localStorage.getItem('authToken')||'' }, withCredentials: true }) : null;
    if (socket) {
        socket.on('connect', () => {
            try { const cur = JSON.parse(localStorage.getItem('currentUser')||'null')||{}; const uid = cur.id || cur.userId || cur._id; if (uid) socket.emit('join', String(uid)); } catch(e){}
        });
        socket.on('conversations:update', (payload) => {
            // Re-fetch conversations for the current user when updates arrive
            const cur = JSON.parse(localStorage.getItem('currentUser')||'null')||{};
            if (cur && cur.id) socket.emit('conversations:get', { userId: cur.id }, (res) => { if (res && res.success && Array.isArray(res.data)) renderList(res.data, cur.id); });
        });
    }
    document.addEventListener('DOMContentLoaded', init);

    function goBack(){ window.history.back(); }

    async function init(){
        const user = JSON.parse(localStorage.getItem('currentUser')||'null')||{};
        document.getElementById('nav-name').textContent = user.name || 'Messages';

        // If no logged in user, show empty state
        if(!user || !user.id){ renderEmpty(); return; }

        try{
            const token = localStorage.getItem('authToken') || localStorage.getItem('token');
            const headers = { 'Content-Type': 'application/json' };
            if(token) headers['Authorization'] = `Bearer ${token}`;

            // Try socket first to get conversations
            let list = [];
            if (socket && socket.connected) {
                await new Promise((resolve) => {
                    socket.emit('conversations:get', { userId: user.id }, (res) => {
                        if (res && res.success && Array.isArray(res.data)) list = res.data;
                        resolve();
                    });
                });
            } else {
                // Fallback to REST
                const res = await fetch(`${API_BASE}/api/messages/conversations`, { credentials: 'include', headers });
                const payload = await res.json().catch(()=>({}));
                if(res.ok && payload && Array.isArray(payload.data)) list = payload.data;
            }

            // The API should return conversations for the current user; filter for provider senders
            if(list.length === 0) return renderEmpty();

            // Render list: ensure we show provider names (other side of convo)
            renderList(list, user.id);
        }catch(e){ console.warn(e); renderEmpty(); }
    }

    function renderEmpty(){
        const wrap = document.getElementById('conversations-card'); wrap.innerHTML = '';
        const empty = document.createElement('div');
        empty.style.padding = '40px';
        empty.style.textAlign = 'center';
        empty.style.color = '#6B7280';
        empty.innerHTML = '<div style="font-weight:700;margin-bottom:8px">No messages</div><div>There are no conversations yet.</div>';
        wrap.appendChild(empty);
    }

    function renderList(items, userId){
        const wrap = document.getElementById('conversations-card'); wrap.innerHTML='';
        // Expect items like { userId, providerId, name, lastMessage, role }
        items.forEach(it=>{
            // Determine the other party: provider should be in it.providerId or it.otherId
            const providerId = it.providerId || it.otherId || it.receiverId || (it.userId && String(it.userId) !== String(userId) ? it.userId : null) || it.id || null;
            let name = it.providerName || it.name || it.fullName || (it.user && it.user.fullName) || null;
            const last = it.lastMessage || it.last || it.last_message || '';

            const row = document.createElement('div'); row.className='list-item';
            const initial = document.createElement('div'); initial.className='initial'; initial.textContent = (name||'P').trim().slice(0,1).toUpperCase();
            const meta = document.createElement('div'); meta.className='meta';
            const left = document.createElement('div'); left.innerHTML = `<div style="font-weight:700">${escapeHtml(name)}</div><div class="muted">${escapeHtml(last)}</div>`;
            const right = document.createElement('div'); right.innerHTML = '<i class="fa-solid fa-chevron-right"></i>';
            meta.appendChild(left); meta.appendChild(right);
            row.appendChild(initial); row.appendChild(meta);
            row.onclick = ()=> openChat(providerId, userId, name);
            wrap.appendChild(row);

            // If name is missing, fetch user/provider details to fill it in
            if ((!name || name === 'null') && providerId) {
                (async () => {
                    try {
                        const token = localStorage.getItem('authToken') || localStorage.getItem('token');
                        const headers = { 'Content-Type': 'application/json' };
                        if (token) headers['Authorization'] = `Bearer ${token}`;
                        const r = await fetch(`${API_BASE}/api/users/${encodeURIComponent(providerId)}`, { headers, credentials: 'include' });
                        const p = await r.json().catch(()=>({}));
                        const fullname = (p && (p.fullName || p.name)) || null;
                        if (fullname) {
                            name = fullname;
                            initial.textContent = name.trim().slice(0,1).toUpperCase();
                            left.innerHTML = `<div style="font-weight:700">${escapeHtml(name)}</div><div class="muted">${escapeHtml(last)}</div>`;
                        }
                    } catch (e) { /* ignore */ }
                })();
            }
        });
    }

    function escapeHtml(s){ if(!s) return ''; return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]; }); }

    function openChat(providerId, userId, providerName){
        // Navigate to the chat page. providers/chat.html expects ref=<providerId>&user=<userId>
        if(!providerId){ return alert('Conversation target missing'); }
        window.location.href = `providers/chat.html?ref=${encodeURIComponent(providerId)}&user=${encodeURIComponent(userId||'')}`;
    }
</script>
</body>
</html>
